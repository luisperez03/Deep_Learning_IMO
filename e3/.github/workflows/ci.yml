name: ci

on:
  push:
  pull_request:

jobs:
  pruebas-livianas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Pruebas del dashboard y de consistencia
        run: pytest tests/test_dashboard.py tests/test_consistencia.py -q

  pruebas-modelo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar torch (CPU) y dependencias
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pytest scipy opencv-python-headless onnx onnxruntime
      - name: Pruebas del modelo original
        run: pytest tests/test_original_model.py -q
